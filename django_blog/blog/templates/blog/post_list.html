{% extends "blog/base.html" %}

{% block content %}
<h1>Blog Posts</h1>

{% for post in posts %}
    <article>
        <h2>
            <a href="{% url 'post-detail' post.pk %}">
                {{ post.title }}
            </a>
        </h2>
        <p>{{ post.content|truncatechars:150 }}</p>
        <small>By {{ post.author }} on {{ post.published_date }}</small>
    </article>
    <hr>
{% empty %}
    <p>No posts available.</p>
{% endfor %}
{% endblock %}
